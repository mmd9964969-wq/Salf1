name: Validate

on:
  push:
    branches: [main, farvahr-self-rebuild]
  pull_request:

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install web dependencies
        run: npm install
      - name: Build web panel
        run: npm run build
      - name: Compile Python worker
        run: python -m compileall -q telegram-worker

      - name: Test weekly presence scheduler and Rich Message rendering
        run: python -m unittest discover -s telegram-worker/tests -v
